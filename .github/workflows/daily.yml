# 매일 아침 6시(KST)에 공고 수집 → 요약 → 빌드 → GitHub Pages 배포
#
# 저장소 설정에서 준비할 것
#   Settings > Secrets and variables > Actions
#     Secrets:
#       BIZINFO_API_KEY          기업마당 API 키 (필수)
#       CLAUDE_CODE_OAUTH_TOKEN  Claude 구독으로 요약할 때. 내 컴퓨터에서 `claude setup-token`으로 발급 (1년 유효)
#       ANTHROPIC_API_KEY        구독 대신 API로 요약할 때 (선택)
#     Variables: SITE_BASE_URL, 선택: SUMMARY_LIMIT(하루 요약 건수, 기본 50), LLM_MODEL, ADSENSE_CLIENT, ADSENSE_SLOT
#   Settings > Pages > Source: GitHub Actions
name: daily-update

on:
  schedule:
    - cron: "0 21 * * *" # UTC 21:00 = KST 06:00
  workflow_dispatch:

permissions:
  contents: write # data/live 갱신 커밋
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests -t .

      # 키를 넣기 전에는 수집·배포를 건너뛰고 경고만 남긴다(매일 실패 메일이 오지 않게).
      - name: 키 확인
        id: check
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$BIZINFO_API_KEY" ]; then
            echo "::warning::BIZINFO_API_KEY 시크릿이 없어 수집·배포를 건너뜁니다. Settings > Secrets and variables > Actions에서 추가하세요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "claude=true" >> "$GITHUB_OUTPUT"; fi

      - name: 공고 수집
        if: steps.check.outputs.ready == 'true'
        run: python run.py fetch
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}

      # --- 구독(Claude Code)으로 새 공고 요약 -------------------------------
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true' && steps.check.outputs.claude == 'true'
        with:
          node-version: 22

      - name: Claude Code로 요약
        if: steps.check.outputs.ready == 'true' && steps.check.outputs.claude == 'true'
        continue-on-error: true # 구독 사용량 한도에 걸려도 사이트는 그대로 배포
        timeout-minutes: 30
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUMMARY_LIMIT: ${{ vars.SUMMARY_LIMIT || '50' }}
        run: |
          npm install -g @anthropic-ai/claude-code
          python run.py queue --limit "$SUMMARY_LIMIT"
          claude -p "$(cat prompts/summarize.md)" \
            --permission-mode acceptEdits \
            --allowedTools "Read,Write,Edit" \
            --max-turns 30

      - name: 요약 결과 반영
        if: steps.check.outputs.ready == 'true' && steps.check.outputs.claude == 'true'
        run: python run.py import

      # --- API로 요약 (ANTHROPIC_API_KEY가 있을 때만 실제로 호출) -------------
      - name: API로 요약
        if: steps.check.outputs.ready == 'true'
        run: python run.py enrich
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}

      - name: 빌드
        if: steps.check.outputs.ready == 'true'
        run: python run.py build
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}

      - name: 데이터 변경분 커밋
        if: steps.check.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%F) 공고 갱신"
          git push

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.ready == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
