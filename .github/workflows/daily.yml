# 매일 아침 6시(KST)에 공고 수집 → 요약 → 빌드 확인 → data/live 커밋·push
# 배포는 Cloudflare Pages(gov-grants)가 GitHub에 연결돼 있어 push를 받으면 알아서 빌드·배포함 (토큰 불필요)
#   Pages 빌드 설정: pip install -r requirements.txt && python run.py build → dist/ (PYTHON_VERSION=3.12)
#
# 저장소 설정에서 준비할 것 (목록은 .github/required-secrets.txt)
#   Settings > Secrets and variables > Actions
#     Secrets:
#       BIZINFO_API_KEY          기업마당 API 키 (필수)
#       CLAUDE_CODE_OAUTH_TOKEN  Claude 구독으로 요약. 내 컴퓨터에서 `claude setup-token`으로 발급 (1년 유효)
#     Variables (선택): SUMMARY_LIMIT(하루 요약 건수, 기본 50)
#   키 등록은 ~/dev/services/grant-sites/scripts/set-secrets.sh 가 .github/required-secrets.txt를 읽어 한 번에 한다.
#   수집 시각(meta.fetched_at)이 매번 바뀌므로 실행할 때마다 커밋이 생기고, Cloudflare가 다시 빌드해 D-day·마감 상태가 갱신됨
name: daily-update

on:
  schedule:
    - cron: "0 21 * * *" # UTC 21:00 = KST 06:00
  workflow_dispatch:

permissions:
  contents: write # data/live 갱신 커밋

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests -t .

      # 키를 넣기 전에는 수집·커밋을 건너뛰고 경고만 남긴다(매일 실패 메일이 오지 않게).
      - name: 키 확인
        id: check
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$BIZINFO_API_KEY" ]; then
            echo "::warning::BIZINFO_API_KEY 시크릿이 없어 수집을 건너뜁니다. ~/dev/services/grant-sites/scripts/set-secrets.sh 를 실행하세요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "claude=true" >> "$GITHUB_OUTPUT"; fi

      - name: 공고 수집
        if: steps.check.outputs.ready == 'true'
        run: python run.py fetch
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}

      # --- 구독(Claude Code)으로 새 공고 요약 -------------------------------
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true' && steps.check.outputs.claude == 'true'
        with:
          node-version: 22

      - name: Claude Code로 요약
        if: steps.check.outputs.ready == 'true' && steps.check.outputs.claude == 'true'
        continue-on-error: true # 구독 사용량 한도에 걸려도 사이트는 그대로 배포
        timeout-minutes: 30
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUMMARY_LIMIT: ${{ vars.SUMMARY_LIMIT || '50' }}
        run: |
          npm install -g @anthropic-ai/claude-code
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils || echo "::warning::PDF 텍스트 추출기를 설치하지 못했습니다."
          fi
          python run.py queue --limit "$SUMMARY_LIMIT"
          claude -p "$(cat prompts/summarize.md)" \
            --permission-mode acceptEdits \
            --tools "Read,Write,Edit" \
            --allowedTools "Read,Write,Edit" \
            --max-turns 30

      - name: 요약 결과 반영
        if: steps.check.outputs.ready == 'true' && steps.check.outputs.claude == 'true'
        run: python run.py import

      # 배포는 Cloudflare가 하지만, 깨진 데이터를 올리지 않도록 여기서도 한 번 빌드해 본다
      - name: 빌드 확인
        if: steps.check.outputs.ready == 'true'
        run: python run.py build

      # push하면 Cloudflare Pages가 빌드·배포 (GitHub 연동)
      - name: 데이터 변경분 커밋
        if: steps.check.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%F) 공고 갱신"
          git push
